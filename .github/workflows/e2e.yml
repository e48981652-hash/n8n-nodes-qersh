# Installs the PUBLISHED package in a fresh self-hosted n8n and runs the store template end to end
# (see e2e/clean-install.mjs) and runs n8n's scanner on it (scripts/scan-check.mjs). Runs after every successful publish,
# on demand, and when the e2e folder changes.
# The script output and the n8n log land in the job summary, which is readable without a GitHub sign-in.
name: Clean install

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to install (default is the version in package.json)
        required: false
        default: ''
      n8n_version:
        description: n8n version to test against
        required: false
        default: '2.43.7'
  workflow_run:
    workflows: [Publish]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'e2e/**'
      - '.github/workflows/e2e.yml'

jobs:
  scan:
    name: n8n scanner on the published version
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # scripts/scan-check.mjs runs @n8n/scan-community-package on <package.json name>@<version> and fails unless the
      # scanner prints "passed all security checks" (the scanner itself exits 0 on failure). The registry can lag a few
      # minutes after a publish, so retry.
      - name: Scan
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/scan-check.mjs ${{ github.event.inputs.version }}; then exit 0; fi
            echo "attempt $attempt failed; waiting 60 s"; sleep 60
          done
          exit 1

  clean-install:
    name: Install from npm and run T3
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      N8N_VERSION: ${{ github.event.inputs.n8n_version || '2.43.7' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # after a publish, test the version that the tag's commit declares
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # n8n 2.43 requires Node 24 or newer
          node-version: 24

      - name: Cache the n8n install
        id: n8n-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/n8n
          key: n8n-${{ env.N8N_VERSION }}-${{ runner.os }}

      - name: Install n8n
        if: steps.n8n-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/n8n"
          cd "$RUNNER_TEMP/n8n"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --loglevel=error "n8n@$N8N_VERSION"

      - name: Start the fake store and n8n
        env:
          N8N_USER_FOLDER: ${{ runner.temp }}/n8n-home
          N8N_PORT: '5680'
          N8N_RUNNERS_BROKER_PORT: '5681'
          N8N_RUNNERS_ENABLED: 'true'
          N8N_UNVERIFIED_PACKAGES_ENABLED: 'true'
          N8N_COMMUNITY_PACKAGES_ENABLED: 'true'
          N8N_DIAGNOSTICS_ENABLED: 'false'
          N8N_SECURE_COOKIE: 'false'
          N8N_PERSONALIZATION_ENABLED: 'false'
          NODE_FUNCTION_ALLOW_BUILTIN: crypto
          STORE_PRICE_MINOR: '15007'
        run: |
          node e2e/fake-store.mjs 8788 > "$RUNNER_TEMP/fake-store.log" 2>&1 &
          "$RUNNER_TEMP/n8n/node_modules/.bin/n8n" start > "$RUNNER_TEMP/n8n.log" 2>&1 &
          # /healthz answers 200 while migrations still run and every REST call then says "n8n is starting up";
          # /healthz/readiness is 200 only once the database is migrated and the server is fully ready; the JSON
          # answer from /rest/settings (public object: settingsMode, no versionCli) confirms the REST routes are mounted
          for i in $(seq 1 150); do
            if curl -sf http://localhost:5680/healthz/readiness > /dev/null && curl -sf http://localhost:5680/rest/settings | grep -q '"settingsMode"'; then
              echo "n8n is ready after $i checks"; exit 0
            fi
            sleep 5
          done
          echo "n8n did not become ready"; tail -50 "$RUNNER_TEMP/n8n.log"; exit 1

      - name: Install the package in n8n and run the store template
        run: |
          set -o pipefail
          node e2e/clean-install.mjs ${{ github.event.inputs.version }} 2>&1 | tee "$RUNNER_TEMP/clean-install.log"

      - name: Job summary
        if: always()
        run: |
          # annotations are readable without a GitHub sign-in; the summary is not
          enc() { sed 's/%/%25/g' | tr '\n' '\001' | sed 's/\x01/%0A/g'; }
          echo "::error title=clean-install output (last 40 lines)::$(tail -40 "$RUNNER_TEMP/clean-install.log" 2>/dev/null | enc)"
          echo "::warning title=n8n log (last 25 lines)::$(tail -25 "$RUNNER_TEMP/n8n.log" 2>/dev/null | cut -c1-300 | enc)"
          {
            echo '## Clean install output'
            echo '```'
            cat "$RUNNER_TEMP/clean-install.log" 2>/dev/null || echo '(no output)'
            echo '```'
            echo '## n8n log (last 150 lines)'
            echo '```'
            tail -150 "$RUNNER_TEMP/n8n.log" 2>/dev/null || echo '(no log)'
            echo '```'
            echo '## Fake store log'
            echo '```'
            cat "$RUNNER_TEMP/fake-store.log" 2>/dev/null || echo '(no log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
